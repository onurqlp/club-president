// Runs inside the existing match-engine closure so highlights use its real event log.
(function () {
  var cpLastDangerMinute = -20;
  var cpHighlightHold = false, cpResumeWanted = false, cpHighlightReleaseTimer = 0;
  function cpHoldForReplay(ms) {
    if (!mt) return;

      cpResumeWanted = !!mt.running;
      cpHighlightHold = true;
      if (mt.running) { mt.running = false; clearInterval(interval); interval = null; state.activeMatch = mt; save(); }
    }
    clearTimeout(cpHighlightReleaseTimer);
    cpHighlightReleaseTimer = setTimeout(function () {
      cpHighlightHold = false;
      if (cpResumeWanted && mt && mt.min < 90) { mt.running = true; interval = setInterval(step, Math.round(135 / mt.speed)); state.activeMatch = mt; save(); updateMatch(); }

  }
  var cpOriginalAdvance = advanceMatchTo;
  advanceMatchTo = function (target, quiet) {
    if (cpHighlightHold) return;
    var first = mt ? mt.pos : 0;
    // Never let the 0.18-minute simulation tick leak into stoppage time: the
    // halftime screen and all first-half stats must represent exactly 45:00.
    if (mt && mt.running && mt.min < 45 && target > 45) target = 45;
    cpOriginalAdvance(target, quiet);
    if (!mt) return;
    var homeClub = clubs.find(function (c) { return c[0] === state.club; });
    var awayClub = clubs.find(function (c) { return c[0] === rival(); });
    var latest = mt.all.slice(Math.max(0, first), mt.pos);
    latest.forEach(function (e) {
      if (cpHighlightHold) return;
      var live = { minute: mt.min, x: e.x == null ? mt.x : e.x, y: e.y == null ? mt.y : e.y, team: e.team || 0, event: e.type, running: !!mt.running, home: mt.home, away: mt.away, colors: [homeClub && homeClub[3] || '#18234e', awayClub && awayClub[4] || '#f1ead7'], fromX: e.fromX, fromY: e.fromY, eventId: e.id, actorIndex:e.actorIndex, receiverIndex:e.receiverIndex, player:e.player, playerId:e.playerId, rosters:[mt.userLineup||[],mt.opponentLineup||[]], formation:state.formation };
      window.CP_LIVE_MATCH = live;
      if (quiet) return;
      var dangerX = e.team === 0 ? Number(e.x) >= 82 : Number(e.x) <= 18;
      var redCard = e.type === 'card' && (e.red === true || e.cardColor === 'red');
      var dangerous = (['pass', 'dribble'].includes(e.type) && dangerX && mt.min - cpLastDangerMinute >= 5) || (e.type === 'shot' && (e.onTarget || Number(e.xg) >= .1));
      var highlight = e.type === 'goal' || redCard || e.type === 'corner' || e.type === 'shot' && (e.onTarget || Number(e.xg) >= .1) || dangerous;
      if (!highlight) return;
      if (dangerous) cpLastDangerMinute = mt.min;
      var labels = { goal: 'GOL!', shot: e.onTarget ? 'TEHLİKELİ ATAK!' : 'ŞUT DENEMESİ', card: redCard ? 'KIRMIZI KART! TAKIM 10 KİŞİ' : 'SARI KART' , corner: 'DURAN TOP FIRSATI' };
      var detail = Object.assign({}, live, { highlight: true, redCard: redCard, title: labels[e.type] || (dangerous ? 'TEHLİKELİ ATAK' : 'KİLİT AN'), message: e.msg || '', player: e.player || '', xg: e.xg || 0, onTarget: !!e.onTarget });
      cpHoldForReplay(e.type === 'goal' ? 5500 : 4500);
      if (e.type === 'goal') {
        var warning = Object.assign({}, detail, { event: 'goal', preGoal: true, title: 'TEHLİKELİ ATAK!', message: (e.team === 0 ? state.club : rival()) + ' ceza sahasına yüklendi, gol tehlikesi büyüyor!' });
        window.dispatchEvent(new CustomEvent('cp:match-event', { detail: warning }));
        window.setTimeout(function () { window.dispatchEvent(new CustomEvent('cp:match-event', { detail: Object.assign({}, detail, { highlight: false, goalReveal: true, scoreText: detail.home + '–' + detail.away }) })); }, 3200);
      } else window.dispatchEvent(new CustomEvent('cp:match-event', { detail: detail }));
    });
  };

  function cpPauseAtHalf() {
    if (!mt || mt.cpHalftimeHold || mt.min < 45 || mt.min >= 90) return;
    mt.min = 45;
    mt.halfTip = true;
    mt.cpHalftimeHold = true;
    mt.running = false;
    clearInterval(interval); interval = null;
    state.activeMatch = mt;
    save(); updateMatch();
    var data = { minute: 45, names: [state.club, rival()], score: [mt.home, mt.away], stats: matchStats(mt.shown, 45) };

  }

  var cpOriginalStep = step;
  step = function () {
    if (mt && mt.cpHalftimeHold) return;

  };

  // A page reload is a natural pause point; persist it so the UI never says
  // "live" while its interval is gone, and restore the 45' intervention.
  var cpOriginalRealSetup = realSetup;
  realSetup = function () {
    cpOriginalRealSetup();
    if (state && state.activeMatch) {
      state.activeMatch.running = false;
      if (state.activeMatch.min >= 45 && state.activeMatch.min < 46) state.activeMatch.cpHalftimeHold = true;
      else if (state.activeMatch.min >= 46) state.activeMatch.cpHalftimeHold = false;
      save();
    }
  };
  // The startup realSetup() ran just before this hook was installed.
  if (state && state.activeMatch) {
    state.activeMatch.running = false;
    if (state.activeMatch.min >= 45 && state.activeMatch.min < 46) state.activeMatch.cpHalftimeHold = true;
    else if (state.activeMatch.min >= 46) state.activeMatch.cpHalftimeHold = false;
    save();
  }

  // Rebuild the tactical break after a refresh so a saved 45' match cannot
  // resume behind the manager's back without showing the intervention screen.
  var cpOriginalSetup = setup;
  setup = function () {
    var match = cpOriginalSetup();
    if (match && match.min >= 45 && match.min < 46 && !match.running) match.cpHalftimeHold = true;
    if (match && match.cpHalftimeHold) {
      window.CP_HALFTIME_DATA = { minute: 45, names: [state.club, rival()], score: [match.home, match.away], stats: matchStats(match.shown || [], 45) };
    }

  };

    var match = setup();

  var cpOriginalFast = fast;
  fast = function () {
    var match = setup();

      match.min = 45;
      cpPauseAtHalf();

    }
    match.cpHalftimeHold = false; window.CP_HALFTIME_DATA = null;
    return cpOriginalFast();
  };
})();
